# Priors over Demucs stem combinations, for sampling mock analysis manifests.
#
# GENERATED by scripts/derive_stem_priors.py --mode reference
# -- edit that script, not this file.
#
# MUSICCAPS IS DELIBERATELY NOT USED HERE. Downstream evaluation runs on
# MusicCaps, so deriving mock corpora from it would make the development
# distribution resemble the evaluation distribution. Only two corpora feed
# this file:
#
#   MoisesDB (n=240)          true multitrack inventories, zero measurement
#                            error, but curated for source separation and so
#                            almost entirely full-band.
#   Nunes & Ordanini 2014    2,399 Billboard Hot 100 songs, instrumentation
#   (n=2399)                 coded over full songs by music-school graduates.
#                            See configs/ground_truth/refs/ for the paper.
#
# THE COST, STATED PLAINLY. Neither corpus publishes a joint distribution over
# stem combinations: Nunes & Ordanini report marginals and QCA configurations
# but never frequencies, and MoisesDB's own joint is 91% full-band across five
# of fifteen cells. So the `reference` profile is the maximum-entropy joint
# given the marginals below, which assumes independence. Real stems are
# positively correlated, so it understates both very sparse and very dense
# combinations, and there is no way to correct that without a corpus that
# actually measures co-occurrence.
#
# In practice this concentrates hard. Check `effective_combinations` per
# profile before using one for coverage work: if a recipe path needs a
# single-stem clip, `reference` will reach it only rarely and `uniform` is the
# profile to use instead.
#
# Marginals blend the two corpora by corpus size, EXCEPT where MoisesDB's rate
# is genre-unstable. Its per-genre spread is 0.01 for vocals and drums and
# 0.03 for bass -- flat, so the pooled rate transfers. For guitar it is 0.21
# and bimodal (1.00 in rock/pop/rap/singer-songwriter, 0.14 in electronic), so
# its pooled rate restates MoisesDB's own genre mix. Guitar therefore takes
# the Nunes & Ordanini value alone rather than a blend, which would only carry
# that bias through at reduced weight.

version: 1
stem_priors:
  mode: reference
  sources:
    moisesdb: {role: marginals_and_joint, n: 240}
    nunes_ordanini_2014: {role: marginals, n: 2399}
    musiccaps: {role: excluded, reason: downstream_evaluation_set}

  enabled_stems: [bass, drums, guitar, vocals]

  marginals:
    bass:
      value: 0.8912
      source: blend
      genre_sd: 0.029
      # moisesdb 0.983, nunes_ordanini 0.882, weighted by corpus size
    drums:
      value: 0.9620
      source: blend
      genre_sd: 0.010
      # moisesdb 0.992, nunes_ordanini 0.959, weighted by corpus size
    guitar:
      value: 0.6090
      source: nunes_ordanini
      genre_sd: 0.209
      # moisesdb says 0.925, rejected: genre_sd above threshold.
    vocals:
      value: 0.9678
      source: blend
      genre_sd: 0.010
      # moisesdb 0.996, nunes_ordanini 0.965, weighted by corpus size

  default_profile: reference

  profiles:

    # Maximum-entropy joint given the marginals above. The best estimate of
    # produced-music stem combinations that owes nothing to MusicCaps.
    # effective combinations: 2.73 of 15
    reference:
      combinations:
        type: choice
        values:
          - value: [bass, drums, guitar, vocals]
            weight: 0.50532
          - value: [bass, drums, vocals]
            weight: 0.32444
          - value: [drums, guitar, vocals]
            weight: 0.06168
          - value: [drums, vocals]
            weight: 0.03960
          - value: [bass, guitar, vocals]
            weight: 0.01998
          - value: [bass, drums, guitar]
            weight: 0.01681
          - value: [bass, vocals]
            weight: 0.01283
          - value: [bass, drums]
            weight: 0.01079
          - value: [guitar, vocals]
            weight: 0.00244
          - value: [drums, guitar]
            weight: 0.00205
          - value: [vocals]
            weight: 0.00157
          - value: [drums]
            weight: 0.00132
          - value: [bass, guitar]
            weight: 0.00066
          - value: [bass]
            weight: 0.00043
          - value: [guitar]
            weight: 0.00008

    # MoisesDB's own combination frequencies, add-1 smoothed. Only 5 of 15
    # cells are populated by actual tracks; the rest are smoothing. Zero
    # measurement error, but the corpus is curated for source separation and
    # so is nearly all full-band. Use it to see what real multitrack
    # inventories look like, not to generate a varied corpus.
    # effective combinations: 1.35 of 15
    moisesdb_empirical:
      combinations:
        type: choice
        values:
          - value: [bass, drums, guitar, vocals]
            weight: 0.85884
          - value: [bass, drums, vocals]
            weight: 0.07059
          - value: [drums, guitar, vocals]
            weight: 0.01569
          - value: [bass, guitar]
            weight: 0.00784
          - value: [vocals]
            weight: 0.00784
          - value: [bass]
            weight: 0.00392
          - value: [bass, drums]
            weight: 0.00392
          - value: [bass, drums, guitar]
            weight: 0.00392
          - value: [bass, guitar, vocals]
            weight: 0.00392
          - value: [bass, vocals]
            weight: 0.00392
          - value: [drums]
            weight: 0.00392
          - value: [drums, guitar]
            weight: 0.00392
          - value: [drums, vocals]
            weight: 0.00392
          - value: [guitar]
            weight: 0.00392
          - value: [guitar, vocals]
            weight: 0.00392

    # Equal weight on all 15 combinations. Carries no information from any
    # corpus, which makes it both the safest choice against resembling the
    # evaluation set and the most efficient for exercising every recipe path.
    # Use this for coverage runs.
    # effective combinations: 15.00 of 15
    uniform:
      combinations:
        type: choice
        values:
          - value: [bass]
            weight: 0.06662
          - value: [bass, drums]
            weight: 0.06667
          - value: [bass, drums, guitar]
            weight: 0.06667
          - value: [bass, drums, guitar, vocals]
            weight: 0.06667
          - value: [bass, drums, vocals]
            weight: 0.06667
          - value: [bass, guitar]
            weight: 0.06667
          - value: [bass, guitar, vocals]
            weight: 0.06667
          - value: [bass, vocals]
            weight: 0.06667
          - value: [drums]
            weight: 0.06667
          - value: [drums, guitar]
            weight: 0.06667
          - value: [drums, guitar, vocals]
            weight: 0.06667
          - value: [drums, vocals]
            weight: 0.06667
          - value: [guitar]
            weight: 0.06667
          - value: [guitar, vocals]
            weight: 0.06667
          - value: [vocals]
            weight: 0.06667
