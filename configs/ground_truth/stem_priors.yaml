# Priors over Demucs stem combinations, for sampling mock analysis manifests.
#
# GENERATED by scripts/derive_stem_priors.py -- edit that script, not this file.
#
# Three corpora are combined, each doing only what it uniquely can:
#
#   MusicCaps (n=5200)      the joint's shape. The only source with a diverse,
#                            complete joint over stem combinations.
#   MoisesDB (n=240)         sensitivity estimation. True multitrack inventories,
#                            so zero measurement error, but nearly every track is
#                            full-band and it carries almost no variance itself.
#   Nunes & Ordanini 2014    held-out validation, never fit to. Expert-coded
#   (n=2399)                 marginals from 2,399 Billboard Hot 100 songs. See
#                            configs/ground_truth/refs/ for the paper.
#
# Captions under-report: they describe a clip, they do not inventory it. So the
# raw MusicCaps joint is biased toward sparse combinations. Conditioning on
# "the caption named every other stem" selects full-band clips, which makes the
# MusicCaps and MoisesDB populations comparable and lets the shortfall be
# attributed to the caption rather than the music. That yields a per-stem
# sensitivity, and the observed set is then modelled as the true set thinned:
# each present stem survives into the caption independently with probability
# s_k. Inverting that by EM gives the `corrected` profile.
#
# Known limitations, in rough order of how much they should worry you:
#
#  - MEASURED: the thinning model assumes per-stem detection is independent, and
#    it is not. Pushing `corrected` back through the model and comparing against
#    what was actually observed, the largest miss is at 4 stem(s), where the
#    model understates reality by 0.016 (28% of its own prediction). Captions are
#    more exhaustive than independent detection allows -- some annotators
#    inventory the clip rather than describe it -- and EM can only account for
#    that by inflating the full-combination cell, so
#    `corrected` overstates dense combinations. Full residuals are under `diagnostics`.
#  - s_k is estimated on full-band clips and then applied everywhere, assuming
#    sensitivity does not vary with how many stems are present. A caption for a
#    sparse clip probably names its one instrument more reliably than a dense mix
#    names each of four, which would push the same way as the point above.
#  - Nunes & Ordanini's guitar marginal is a RANGE, [0.388, 0.788], because the
#    paper reports clean/distorted/acoustic separately and never publishes their
#    overlap. The 0.60 used for the `produced` profile is a midpoint guess and is
#    the weakest number here. The authors offer raw data on request.
#  - MoisesDB is 240 tracks over 47 artists and is rock-heavy, so its effective n is
#    well below 240. Its marginals all sit near 1.0, which makes s_k robust to
#    that (the divisor is ~1), but the conditioning population still differs.

version: 1
stem_priors:
  sources:
    musiccaps: {role: joint_shape, n: 5200}
    moisesdb: {role: sensitivity, n: 240}
    nunes_ordanini_2014: {role: validation_only, n: 2399}

  # P(a caption names the stem | the stem is present): a MusicCaps conditional
  # divided by how often the stem is really there. Lower means captions miss it
  # more often, so the correction moves more mass onto combinations containing it.
  #
  # The denominator comes from MoisesDB only where its rate is genre-invariant.
  # `genre_sd` is the n-weighted spread of its per-genre presence rate; above
  # 0.10 the pooled rate measures MoisesDB's genre mix rather than the stem, and
  # an external, genre-diverse anchor is used instead.
  sensitivity:
    drums:
      value: 0.821
      truth: 0.992
      truth_source: moisesdb
      genre_sd: 0.010
    guitar:
      value: 0.795
      truth: 0.609
      truth_source: external
      genre_sd: 0.209
      # MoisesDB says 0.925, rejected: genre_sd 0.209 is above the threshold.
      # Using it would deflate this sensitivity and over-inflate the stem.
    bass:
      value: 0.701
      truth: 0.983
      truth_source: moisesdb
      genre_sd: 0.029
    vocals:
      value: 0.660
      truth: 0.996
      truth_source: moisesdb
      genre_sd: 0.010

  # Dirichlet smoothing per cell in the EM M-step, in clip-equivalents. Without
  # it the deconvolution drives rare combinations to exactly zero, which is the
  # usual ill-posedness of deconvolution rather than a fact about music.
  #
  # Measured over alpha = 0, 5, 20, 50, 100, effective combinations run 4.5, 5.5,
  # 6.9, 8.7, 10.7 while the marginals move much less: bass is flat to +-0.002,
  # drums and vocals within 0.06, guitar 0.695 -> 0.601. Guitar is the most
  # regularizer-sensitive because it is the most-corrected stem (lowest s_k), and
  # alpha = 100 is an extreme -- 29% of the total mass as uniform prior -- not a
  # real operating point. Over 5..50 every stem holds within 0.06. So alpha
  # mainly trades combination diversity against fidelity to the unregularized
  # solution, but do not read guitar's corrected marginal as alpha-independent.
  alpha: 20

  enabled_stems: [bass, drums, guitar, vocals]

  # Diagnostics, carried so the file audits itself.
  #
  # NOTE these marginals are unconditional: they include the empty-combination
  # mass listed just below them. The profiles drop the empty combination and
  # renormalize, so sampling a profile reproduces marginal/(1 - empty), not the
  # marginal printed here. For `corrected` that is the difference between bass
  # at 0.482 here and 0.545 when sampled.
  diagnostics:
    marginals:
      bass: {observed: 0.3413, corrected: 0.4819}   # Nunes & Ordanini 0.882
      drums: {observed: 0.5012, corrected: 0.5914}   # Nunes & Ordanini 0.959
      guitar: {observed: 0.3648, corrected: 0.4619}   # Nunes & Ordanini 0.600
      vocals: {observed: 0.4221, corrected: 0.6151}   # Nunes & Ordanini 0.965
    empty_combination: {observed: 0.1969, corrected: 0.1153}
    effective_combinations: {observed: 11.78, corrected: 8.85}
    # Model fit: push `corrected` back through the thinning model and compare
    # against what was actually observed. Divergence means detection is
    # correlated across stems, which the model cannot represent. Keyed by how
    # many stems the caption named.
    observed_cardinality: {0: 0.1969, 1: 0.3008, 2: 0.2542, 3: 0.1721, 4: 0.0760}
    predicted_cardinality: {0: 0.1915, 1: 0.3091, 2: 0.2700, 3: 0.1698, 4: 0.0595}
    cardinality_residual: {0: +0.0054, 1: -0.0084, 2: -0.0157, 3: +0.0023, 4: +0.0164}
    # MoisesDB stems per track, over its own 11-category taxonomy. Not directly
    # comparable to the 4 Demucs stems above, but the best cardinality truth there is.
    moisesdb_cardinality: {2: 1, 3: 1, 4: 59, 5: 49, 6: 60, 7: 44, 8: 18, 9: 7, 10: 1}

  # Sampling reads this profile unless told otherwise.
  default_profile: corrected

  profiles:

    # Raw MusicCaps joint, uncorrected. Most diverse of the three, so this is
    # the one to use for recipe-coverage testing: it visits single-stem
    # combinations often enough to exercise those paths.
    observed:
      combinations:
        type: choice
        values:
          - value: [drums]
            weight: 0.13460  # n=562
          - value: [guitar]
            weight: 0.11327  # n=473
          - value: [bass, drums, vocals]
            weight: 0.10081  # n=421
          - value: [vocals]
            weight: 0.09602  # n=401
          - value: [bass, drums, guitar, vocals]
            weight: 0.09459  # n=395
          - value: [drums, vocals]
            weight: 0.08716  # n=364
          - value: [bass, drums]
            weight: 0.07447  # n=311
          - value: [guitar, vocals]
            weight: 0.06082  # n=254
          - value: [bass, drums, guitar]
            weight: 0.04933  # n=206
          - value: [drums, guitar, vocals]
            weight: 0.04262  # n=178
          - value: [drums, guitar]
            weight: 0.04047  # n=169
          - value: [bass, guitar]
            weight: 0.03161  # n=132
          - value: [bass]
            weight: 0.03065  # n=128
          - value: [bass, vocals]
            weight: 0.02203  # n=92
          - value: [bass, guitar, vocals]
            weight: 0.02155  # n=90

    # Deconvolved for caption under-reporting. Best estimate of true stem
    # prevalence in arbitrary audio, and the default.
    corrected:
      combinations:
        type: choice
        values:
          - value: [bass, drums, guitar, vocals]
            weight: 0.22277
          - value: [bass, drums, vocals]
            weight: 0.15836
          - value: [vocals]
            weight: 0.08313
          - value: [guitar, vocals]
            weight: 0.07940
          - value: [drums]
            weight: 0.07909
          - value: [guitar]
            weight: 0.07884
          - value: [drums, vocals]
            weight: 0.07752
          - value: [bass, drums]
            weight: 0.04352
          - value: [drums, guitar, vocals]
            weight: 0.03201
          - value: [bass, drums, guitar]
            weight: 0.02989
          - value: [bass, guitar]
            weight: 0.02946
          - value: [drums, guitar]
            weight: 0.02537
          - value: [bass, guitar, vocals]
            weight: 0.02440
          - value: [bass]
            weight: 0.01852
          - value: [bass, vocals]
            weight: 0.01772

    # `corrected` raked onto Nunes & Ordanini marginals: full-band produced
    # pop rather than arbitrary audio. Much less diverse, so it is not the
    # default -- use it when mock clips should look like charting records.
    produced:
      combinations:
        type: choice
        values:
          - value: [bass, drums, guitar, vocals]
            weight: 0.53740
          - value: [bass, drums, vocals]
            weight: 0.30952
          - value: [drums, vocals]
            weight: 0.05579
          - value: [drums, guitar, vocals]
            weight: 0.02843
          - value: [guitar, vocals]
            weight: 0.01124
          - value: [bass, drums]
            weight: 0.01066
          - value: [vocals]
            weight: 0.00953
          - value: [bass, guitar, vocals]
            weight: 0.00938
          - value: [bass, drums, guitar]
            weight: 0.00904
          - value: [drums]
            weight: 0.00713
          - value: [bass, vocals]
            weight: 0.00552
          - value: [drums, guitar]
            weight: 0.00282
          - value: [bass, guitar]
            weight: 0.00142
          - value: [guitar]
            weight: 0.00140
          - value: [bass]
            weight: 0.00072
