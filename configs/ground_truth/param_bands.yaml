# Natural-language descriptor bands for operator parameters.
#
# These are the "predefined parameter ranges" that abstraction level 1 speaks in
# instead of exact values. Every band set is grounded in the sampled support
# declared in distributions.yaml: `sample_refs` names the distribution leaves a
# parameter is drawn from (via motifs.yaml / recipes.yaml), and the loader
# rejects a band set that leaves part of that support uncovered or that declares
# a band no sampled value can reach.
#
# Editing guideline:
# - put band edges on the midpoints between the `samples` landmarks of the
#   referenced distribution, so each landmark lands in a distinct band
# - `suggested_terms` are suggestions handed to the writer, never a required
#   vocabulary; order them most literal first
# - bands are half-open [previous upper, upper); the first band has no lower
#   bound and the last `upper` is the top edge of the parameter
# - `role` decides how a parameter is used downstream:
#     magnitude  -> also feeds the chain intensity aggregate
#     character  -> shapes wording but not intensity
#     ignore     -> carries no perceptual information on its own
# - `direction` controls binning and intensity: ascending (higher value = more
#   intense), descending (lower value = more intense), absolute (bin on |value|)
# - `sample_refs: []` marks a provisional band set for an operator no recipe
#   samples yet; the loader skips grounding checks for it
version: 1

shared_bands:
  # Spectral regions spanning every cutoff value reachable from
  # distributions.yaml, from 18 Hz rumble poisons up to 8.5 kHz air shelves.
  # Region edges sit in the empty gaps between the clusters of sampled cutoffs
  # (18-60, 300-1000, 2200-3000, 3800-4500, 5000-8500) so no region is dead.
  frequency_regions:
    - upper: 100.0
      suggested_terms: [subsonic, infrasonic, below the audible low end]
    - upper: 600.0
      # `boomy` is DAFx-17 T2's most EQ-specific descriptor: boom is EQ 7/7,
      # g=0.86, and zero for every other effect.
      suggested_terms: [low end, bass, body, boomy]
    - upper: 1200.0
      suggested_terms: [low mids, boxiness, lower midrange]
    - upper: 3400.0
      suggested_terms: [upper mids, presence, forward midrange]
    - upper: 4800.0
      # DAFx-17 T2 sharp: EQ 7, g=0.86.
      suggested_terms: [sibilance, harshness, bite, sharp]
    - upper: 22000.0
      # DAFx-17 T2 crisp: EQ 9/9. `air` and `bright` are from the same table.
      suggested_terms: [top end, air, brightness, crisp]

param_bands:
  separate_audio:
    description:
      role: ignore
      note: Stem selector, not a perceptual parameter.

  apply_reverb_effect:
    room_size:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 1.0
      sample_refs: [space.shared_send.reverb.room_size]
      bands:
        - upper: 0.375
          suggested_terms: [tight, small, intimate]
        - upper: 0.625
          suggested_terms: [medium-sized, moderate, room-sized]
        - upper: 0.85
          # `distant` is SocialFX T1 reverb-tending.
          suggested_terms: [large, spacious, hall-like, distant]
        - upper: 0.96
          # `grand` is SocialFX T1 reverb-tending, `cathedral-like` -specific.
          suggested_terms: [cavernous, vast, enormous, grand, cathedral-like]
    damping:
      role: character
      direction: ascending
      unit: normalized
      sample_refs: [space.shared_send.reverb.damping]
      hint: Low damping rings out bright; high damping soaks up the top end.
      bands:
        - upper: 0.4
          suggested_terms: [bright, glassy, ringing]
        - upper: 0.675
          suggested_terms: [balanced, natural]
        - upper: 0.81
          # `gloomy` is SocialFX T1 reverb-specific; `muffled` is its general tier.
          suggested_terms: [dark, damped, muffled, gloomy]
    # Space motifs pin the reverb fully wet and let the enclosing send_return
    # block set the audible amount, so these carry no magnitude of their own.
    wet_level:
      role: ignore
      note: Always 1.0 on the wet path; audible amount lives on send_return.
    dry_level:
      role: ignore
      note: Always 0.0 on the wet path.
    width:
      role: ignore
      note: Pinned to 1.0 by every motif.
    freeze_mode:
      role: ignore
      note: Pinned to 0.0 by every motif.

  apply_delay_effect:
    delay_seconds:
      role: character
      direction: ascending
      unit: seconds
      # The synced motif derives this from beats x tempo rather than sampling it
      # directly, so the top band is deliberately wider than the free-time
      # support: 1.5 beats at 60 BPM reaches 1.5 s.
      sample_refs: [space.shared_send.delay.free.seconds]
      bands:
        - upper: 0.185
          # No "doubling" here: MusicRadar puts doubling at 50ms and under and
          # slapback at 100ms and over, and the shortest delay this pipeline can
          # produce is 120ms -- the free-time support starts at 0.12s, and half
          # a beat only reaches 0.12s at 250 BPM. Slapback is the whole band.
          suggested_terms: [slapback, very short]
        - upper: 0.35
          suggested_terms: [short, quick echo]
        - upper: 0.6
          suggested_terms: [medium, mid-length echo]
        - upper: 3.01
          suggested_terms: [long, trailing, spacious echo]
    feedback:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 0.75
      sample_refs: [space.shared_send.feedback]
      bands:
        - upper: 0.09
          suggested_terms: [a single repeat, no tail]
        - upper: 0.265
          suggested_terms: [a couple of repeats, short tail]
        - upper: 0.4
          suggested_terms: [several repeats, echoing]
        - upper: 0.46
          suggested_terms: [many repeats, regenerating, washed-out tail]
    mix:
      role: ignore
      note: Always 1.0 on the wet path; audible amount lives on send_return.

  apply_chorus_effect:
    rate_hz:
      role: character
      direction: ascending
      unit: hz
      sample_refs: [tone.modulation.chorus.rate_hz]
      # The prior tops out at 0.9 Hz, so there is deliberately no "fast" band.
      bands:
        - upper: 0.625
          suggested_terms: [very slow, drifting, barely moving]
        - upper: 1.01
          suggested_terms: [slow, gently swaying]
    depth:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 1.0
      sample_refs: [tone.modulation.chorus.depth]
      bands:
        - upper: 0.375
          suggested_terms: [mild, gentle, shallow]
        - upper: 0.55
          suggested_terms: [moderate, medium]
        - upper: 0.66
          suggested_terms: [deep, lush, wide]
    mix:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 1.5
      sample_refs: [tone.modulation.chorus.mix]
      bands:
        - upper: 0.325
          suggested_terms: [subtle, blended in behind the dry signal]
        - upper: 0.5
          suggested_terms: [clearly present, obvious]
        - upper: 0.61
          suggested_terms: [heavily blended, prominent, front-and-centre]
    centre_delay_ms:
      role: ignore
      note: Sampled uniformly over 20–50 ms.
    feedback:
      role: ignore
      note: Sampled uniformly over 0.0–0.3.

  apply_distortion_effect:
    drive_db:
      role: magnitude
      direction: ascending
      unit: db
      weight: 2.0
      sample_refs: [drums.distortion.drive_db]
      bands:
        - upper: 8.0
          suggested_terms: [light saturation, warmth, a touch of colour]
        - upper: 12.0
          suggested_terms: [obvious grit, crunch, edge]
        - upper: 15.01
          suggested_terms: [heavy, aggressive, crushed]

  apply_compressor_effect:
    ratio:
      role: magnitude
      direction: ascending
      unit: ratio
      weight: 1.0
      sample_refs:
        - vocals.compression.ratio
        - drums.parallel_compression.ratio
      bands:
        - upper: 5.0
          suggested_terms: [gentle, light leveling]
        - upper: 7.0
          suggested_terms: [moderate control]
        - upper: 10.0
          suggested_terms: [firm, tight]
        - upper: 20.01
          suggested_terms: [heavy, squashed, slammed]
    threshold_db:
      role: magnitude
      direction: descending
      unit: db
      weight: 0.5
      sample_refs:
        - vocals.compression.threshold_db
        - drums.parallel_compression.threshold_db
      hint: A lower threshold means more of the signal is being compressed.
      bands:
        - upper: -33.0
          suggested_terms: [clamping down on nearly everything]
        - upper: -29.0
          suggested_terms: [working on most of the signal]
        - upper: -26.0
          suggested_terms: [working on the louder material]
        - upper: 0.01
          suggested_terms: [catching only the peaks]
    attack_ms:
      role: character
      direction: ascending
      unit: ms
      sample_refs: [vocals.compression.attack_ms]
      bands:
        - upper: 7.5
          suggested_terms: [fast attack, grabbing transients]
        - upper: 20.01
          suggested_terms: [moderate attack, letting transients through]
    release_ms:
      role: character
      direction: ascending
      unit: ms
      sample_refs: [vocals.compression.release_ms]
      bands:
        - upper: 65.0
          suggested_terms: [quick release, lively, pumping]
        - upper: 200.01
          suggested_terms: [slow release, smooth, unobtrusive]

  apply_gain:
    # Gain serves two unrelated jobs, and the same dB figure means different
    # things in each: a stem rebalance is a mix decision, while the harmony
    # tuck is a routine backoff. The default bands are calibrated on the
    # rebalance recipes and `by_label` re-scopes the harmony motif's step.
    gain_db:
      role: magnitude
      direction: absolute
      unit: db
      weight: 1.0
      sample_refs:
        - balance.target_gain.up_db
        - balance.target_gain.down_db
      hint: Sign says lift or trim; the band describes how far.
      bands:
        - upper: 4.0
          suggested_terms: [a modest amount, noticeably]
        - upper: 6.0
          suggested_terms: [substantially, a good deal]
        - upper: 8.01
          suggested_terms: [drastically, way up or way down]
      by_label:
        tuck_harmony:
          weight: 0.5
          sample_refs: [vocals.harmony.backoff_db]
          hint: How far the generated harmony sits under the lead.
          bands:
            - upper: 2.5
              suggested_terms: [tucked just under the lead, close behind]
            - upper: 4.5
              suggested_terms: [tucked clearly under the lead]
            - upper: 6.01
              suggested_terms: [tucked well under the lead, kept in the background]

  apply_highpass_filter:
    cutoff_frequency_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      hint: Everything below this region is removed.
      sample_refs:
        - space.shared_send.post_eq.highpass_hz
        - cleanup.hum.highpass_hz
        - cleanup.rumble.highpass_hz
        - vocals.harmony.post_eq.highpass_hz

  apply_lowpass_filter:
    cutoff_frequency_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      hint: Everything above this region is removed.
      sample_refs:
        - space.shared_send.post_eq.lowpass_hz
        - tone.retro.lowpass_hz
        - vocals.harmony.post_eq.lowpass_hz

  apply_highshelf_filter:
    cutoff_frequency_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      hint: The shelf tilts everything above this region.
      sample_refs: [tone.retro.shelf_cut_hz]
    gain_db:
      role: magnitude
      direction: absolute
      unit: db
      weight: 0.75
      sample_refs: [tone.retro.shelf_gain_db]
      bands:
        - upper: 6.5
          suggested_terms: [a gentle tilt, a slight rolloff]
        - upper: 12.01
          suggested_terms: [a strong tilt, a marked rolloff]
    q:
      role: ignore
      note: Pinned to the default 0.707 by the retro motif.

  apply_lowshelf_filter:
    # No recipe samples the low shelf yet; bands mirror the high shelf so random
    # plans still render, and are provisional until a motif grounds them.
    cutoff_frequency_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      hint: The shelf tilts everything below this region.
      sample_refs: []
    gain_db:
      role: magnitude
      direction: absolute
      unit: db
      weight: 0.75
      sample_refs: []
      bands:
        - upper: 6.5
          suggested_terms: [a gentle tilt, a slight lift or trim]
        - upper: 12.01
          suggested_terms: [a strong tilt, a marked lift or trim]

  apply_peak_filter:
    cutoff_frequency_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      hint: The bell is centred on this region.
      sample_refs: [cleanup.vocal_sibilance.cut_hz]
    gain_db:
      role: magnitude
      direction: absolute
      unit: db
      weight: 0.75
      sample_refs: [cleanup.vocal_sibilance.cut_db]
      bands:
        - upper: 4.0
          suggested_terms: [a narrow trim, a light dip]
        - upper: 12.01
          suggested_terms: [a firm notch, a decisive cut]
    q:
      role: character
      direction: ascending
      unit: q
      sample_refs: [cleanup.vocal_sibilance.q]
      bands:
        - upper: 3.25
          suggested_terms: [moderately narrow, focused]
        - upper: 12.01
          suggested_terms: [narrow, surgical, pinpoint]

  apply_harmony_effect:
    semitones:
      role: character
      direction: absolute
      unit: semitones
      sample_refs: [vocals.harmony.intervals]
      hint: Sign says above or below the lead.
      bands:
        - upper: 4.0
          suggested_terms: [a close harmony, a third]
        - upper: 6.0
          suggested_terms: [a fourth or fifth apart]
        - upper: 12.01
          suggested_terms: [a wide harmony, a fifth or more]
    key:
      role: ignore
      note: Musical key, inherited from clip analysis.
    mode:
      role: ignore
      note: Musical mode, inherited from clip analysis.

  introduce_mains_hum:
    level_db:
      role: magnitude
      direction: ascending
      unit: db
      weight: 1.5
      sample_refs: [poison.noise.hum_level_db]
      bands:
        - upper: -27.0
          suggested_terms: [a faint hum, a low buzz]
        - upper: 0.01
          suggested_terms: [an audible hum, an intrusive buzz]
    modulation_hz:
      role: character
      direction: ascending
      unit: hz
      sample_refs: [poison.noise.hum_modulation_hz]
      bands:
        - upper: 0.275
          suggested_terms: [steady, unwavering]
        - upper: 1.01
          suggested_terms: [slowly wavering, drifting in level]
    fundamental_hz:
      role: ignore
      note: Regional mains frequency, not a perceptual choice.

  introduce_low_frequency_rumble:
    level_db:
      role: magnitude
      direction: ascending
      unit: db
      weight: 1.5
      sample_refs: [poison.noise.rumble_level_db]
      bands:
        - upper: -21.0
          suggested_terms: [a low-level rumble, a faint floor]
        - upper: 0.01
          suggested_terms: [a heavy rumble, an intrusive low roar]
    highpass_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      sample_refs: [poison.noise.rumble_highpass_hz]
    lowpass_hz:
      role: character
      direction: ascending
      unit: hz
      bands_ref: shared.frequency_regions
      sample_refs: [poison.noise.rumble_lowpass_hz]
    modulation_hz:
      role: character
      direction: ascending
      unit: hz
      sample_refs: [poison.noise.rumble_modulation_hz]
      bands:
        - upper: 0.275
          suggested_terms: [steady, unwavering]
        - upper: 1.01
          suggested_terms: [slowly wavering, breathing]

# Levels declared on send_return blocks rather than on an operator. These carry
# the audible amount for aux-space and parallel-compression chains, which is why
# the wet-path operator levels above are marked `ignore`.
block_bands:
  send_return:
    send_level:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 1.0
      sample_refs:
        - space.shared_send.send_level
        - drums.parallel_compression.send_level
      # The top band covers the literal `send_level: 1.0` on the harmony support
      # recipe, which feeds the whole signal to the aux rather than sampling.
      bands:
        - upper: 0.4
          suggested_terms: [a light feed into the effect]
        - upper: 0.65
          suggested_terms: [a moderate feed into the effect]
        - upper: 0.9
          suggested_terms: [a strong feed into the effect]
        - upper: 1.01
          suggested_terms: [the whole signal fed into the effect]
    return_level:
      role: magnitude
      direction: ascending
      unit: normalized
      weight: 2.0
      sample_refs:
        - space.shared_send.return_level
        - drums.parallel_compression.return_level
      hint: This is the single strongest cue for how audible the effect is.
      bands:
        - upper: 0.55
          suggested_terms: [tucked well under the dry signal, subtle]
        - upper: 0.725
          suggested_terms: [sitting under the dry signal, supportive]
        # The edge sits just above unity so that a return_level of exactly 1.0,
        # which several recipes pin, reads as level with the dry signal rather
        # than as pushed above it.
        - upper: 1.01
          suggested_terms: [clearly audible, level with the dry signal]
        - upper: 1.2
          suggested_terms: [pushed above the dry signal, dominant]
    dry_level:
      role: ignore
      note: Pinned to 1.0 by every send_return recipe.

# Vocabulary safe to use about any chain, whatever effects are in it. This is
# SocialFX Table 1's *general* tier: words their raters used for all three of
# EQ, reverberation and compression. It is therefore not evidence about delay,
# modulation or pitch, which that study did not test -- those keep the
# hand-written overlays below.
chain_vocabulary: [warm, loud, soft, clear, muffled, bright, calm]

# Overlays widen the suggested vocabulary for a band when particular effects are
# present in the chain, so descriptor wording can follow the character of the
# chain as a whole. Tags are the operator tags from operators.yaml. Overlays
# only ever append suggestions, so the magnitude axis stays intact.
#
# Sources: SocialFX T1's *tending* tier supplies the reverb, compression and EQ
# rows -- words that lean to one effect but appear in others, which is exactly
# what a suggestion should be. MusicRadar's modulation guide supplies the split
# between chorus and phaser.
context_overlays:
  # These were one `modulation` overlay, which conflated two different effects:
  # MusicRadar is explicit that swirling and metallic are the phaser's
  # character, while thickening, doubling and detuning are the chorus's. Both
  # operators already carry their own tag alongside `modulation`.
  - when_chain_has_tags: [chorus]
    add_terms: [thickened, doubled, detuned, rich, dense]
  - when_chain_has_tags: [phaser]
    add_terms: [swirling, metallic, sweeping]
  - when_chain_has_tags: [distortion]
    add_terms: [gritty, crushed, ragged, dirty]
  - when_chain_has_tags: [reverb, delay]
    add_terms: [distant, hollow, spacey, dreamy, echoing, washy, cavernous]
  # `punchy` is deliberately gone: DAFx-17 T2 measures punch at EQ 7 g=0.86 as
  # well as Comp 9 g=0.71, so it is not compression's word to lend.
  - when_chain_has_tags: [compression, limiter]
    add_terms: [quiet, full, crisp, energetic, subtle, clean, dense]
  - when_chain_has_tags: [eq_pass]
    add_terms: [cold, soothing, harsh, mellow, thin, filtered, band-limited]
  - when_chain_has_tags: [harmony, pitch]
    add_terms: [stacked, choral, layered]
  - when_chain_has_tags: [poison, noise]
    add_terms: [noisy, degraded, dirty-sounding]

# Colloquial names accepted in place of an operator's technical name where a
# level requires effects to be named. Additive: the name derived from the
# operator itself always stays acceptable. This exists because the prompt
# already suggests colloquial wording — `gritty` and `dirty` are offered to any
# chain carrying the distortion tag above — so a writer that takes the
# suggestion should not then be failed for not saying "distortion".
#
# Matching is substring-based on a lowercase, alphanumeric-only rendering of the
# text, which has two consequences:
# - a stem covers its inflections: `grit` matches "gritty", `crunch` matches
#   "crunchy", `saturate` matches "saturated"
# - separators vanish but word order survives, so a phrase matches only that
#   exact sequence of words: `turn up` catches "turn up the drums" but not
#   "turn it up", which is why both are listed. A separated object still slips
#   through — "turn the drums up" matches neither, and cannot be enumerated —
#   so the single words below carry most of the load for gain.
#
# Editing guideline: include a word only if it identifies this processor on its
# own. Deliberately excluded: `level` for gain, which would be satisfied by the
# return_level band term "level with the dry signal"; `boost` and `trim`, which
# the shelf and peak filters equally earn through their own gain_db; `warmth`
# and `colour` for distortion, which read just as naturally as a low-shelf move.
#
# Three of those exclusions are corroborated by the descriptor studies in refs/:
# - warm belongs to EQ, not distortion (DAFx-17 T2: EQ 11/13 g=0.82 against
#   Dist 2), and SocialFX T1 files it in the *general* tier, used for any effect.
# - `punch` is shared rather than compressor-specific (DAFx-17 T2: EQ 7 g=0.86
#   AND Comp 9 g=0.71), so it stays out of apply_compressor_effect.
# - SocialFX T1 calls `volume` compression-specific, but only because
#   compression was the sole loudness-changing effect they tested. Here it
#   belongs to apply_gain and is left there.
#
# A word must also survive contact with ordinary English, not only with this
# file. Matching starts on a word boundary, so a candidate can no longer hide
# mid-word or across a gap -- `hall` no longer matches "shallow", nor `echo`
# "the chorus", which is why both are accepted above. What remains a hazard is
# being the opening of a longer unrelated word: that is what still rules out
# `comp` ("complex") and `limit` ("band-limited").
operator_names:
  apply_gain:
    - volume
    - louder
    - quieter
    - turn up
    - turn it up
    - turn down
    - turn it down
  # DAFx-17 Table 2 measures crunch at distortion 14/15, g=0.78 and fuzz at
  # 11/11, g=0.64 -- the two most distortion-specific descriptors it reports.
  apply_distortion_effect:
    - grit
    - dirt
    - crunch
    - fuzz
    - saturate
    - saturation
    - overdrive
    - drive
  # One entry covers the whole word family, since matching is substring-based:
  # `compress` catches compress, compresses, compressed, compressing,
  # compression, compressor and compressors. The name-derived token
  # `compressor` catches only the last two, which is why "add gentle
  # compression" is rejected without this.
  # Reverb-specific words from SocialFX Table 1, whose reverb row is the one
  # genuinely usable list in that table, plus `room` -- the strongest reverb
  # descriptor in DAFx-17 Table 2, at 13/13 entries with g=0.72. `room`, `hall`
  # and `cavern` also echo this operator's own room_size band terms, so a writer
  # who takes the suggested wording passes the check.
  #
  # `cavern` covers "cavernous" and `church` covers "church-like" by substring.
  # `ambience` deliberately does not cover "ambient", which is a genre word in
  # the dataset configs and would describe the music rather than the effect.
  # `space` and `wash` stay out: both are load-bearing style vocabulary in the
  # AL2 exemplars, and neither picks reverb out from delay.
  #
  # `hall` is safe only because matching starts on a word boundary: under the
  # old substring rule it matched "shallow", the standard word for low chorus
  # depth, and would have satisfied reverb on any chain carrying both.
  apply_reverb_effect:
    - room
    - hall
    - cathedral
    - church
    - cavern
    - ambience
    - verb
  # MusicRadar's delay guide names the family: echo, slapback, repeats. The
  # type names it also lists -- ping-pong, tape echo, dub, multi-tap -- are left
  # out, because this operator is a single mono tap and models none of them.
  # `repeat` is the stem form, so it covers repeats/repeated/repeating and
  # echoes the feedback band terms. `echo` is only safe under the word-boundary
  # matcher: with plain substring matching it matched "the chorus".
  apply_delay_effect:
    - echo
    - slapback
    - repeat
  apply_compressor_effect:
    - compress
  # `limit` and `limited` are deliberately absent: both are substrings of
  # "band-limited", an eq_pass overlay term above, so either would let a
  # filtered send satisfy the limiter check. `limiting` is not a substring of
  # it, and `limiter` already matches from the operator's own name.
  apply_limiter_effect:
    - limiting
    - ceiling
    - brickwall
  # `apply_noisegate` has no underscore-separated tail, so its name yields only
  # "noisegate" and the bare word "gate" would otherwise be rejected. `gating`
  # needs its own entry because it does not contain "gate".
  apply_noisegate:
    - gate
    - gating
  # "hum" already matches from the operator's own name, so only the buzz
  # synonym is additive here.
  introduce_mains_hum:
    - buzz
  # "rumble" likewise already matches. `low-end noise` is the most generic
  # entry in this section and the first to drop if it proves too loose.
  introduce_low_frequency_rumble:
    - roar
    - thud
    - low-end noise

# Words accepted as naming the stem an edit is applied to. The separate block
# always names its target with the bare Demucs stem, so these are keyed on that
# stem, and the stem's own name is always accepted on top of the list.
#
# These are a deliberate subset of the `demucs_target_map` in the dataset
# configs, which maps ~200 instrument words onto the same six stems. Only the
# words a producer would actually reach for are listed; the map's long tail
# ("guitareelectrique", "cvp509") would add no coverage here. Derive these from
# that map at runtime instead if you want the full instrument vocabulary.
#
# Singular forms do the work of both numbers, since matching is substring-based:
# `vocal` covers "vocals", `drum` covers "drums".
#
# `low end` is deliberately absent from bass: it is a spectral region term in
# `shared_bands.frequency_regions`, so a high-pass on any stem would satisfy it.
stem_names:
  vocals: [vocal, voice, vox, singer, singing, choir]
  drums: [drum, kit, percussion, beat]
  bass: [bass]
  guitar: [guitar, gtr]
  piano: [piano, keys, keyboard, organ]
  # The catch-all stem has no word a producer would use for it, so requiring one
  # would fail every plan that targets it. An empty list exempts the stem.
  # Currently unreachable — `_build_target_candidates` drops `other` candidates
  # before a plan can target one — and kept only so that removing that skip does
  # not start failing every plan.
  other: []

# Chain-level intensity: the weighted mean of the band positions of every
# magnitude-role parameter in the chain, on 0..1. Abstraction level 2 is graded
# on conveying this, so it is computed here rather than left to the writer.
#
# Edges sit on the quartiles so that a chain with a single four-band parameter
# maps straight through: band k of that parameter lands in intensity band k.
# Uneven edges skew the corpus, because a parameter is placed at the centre of
# its band's slot and so clusters at 0.125 / 0.375 / 0.625 / 0.875.
chain_magnitude:
  bands:
    - upper: 0.25
      suggested_terms: [subtle, understated, barely there]
    - upper: 0.5
      suggested_terms: [noticeable, tasteful, present]
    - upper: 0.75
      suggested_terms: [strong, obvious, assertive]
    # The scale is relative to what this corpus does, and the corpus is mostly
    # ordinary mixing moves, so the top quartile is "pushed hard" rather than
    # destroyed. Reserve outright wreckage for the poison recipes.
    - upper: 1.01
      suggested_terms: [pushed hard, aggressive, heavy-handed]
