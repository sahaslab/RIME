    outputs:
    - target_stem
    - residual
  - kind: chain
    prefix: target_highpass_compression
    source: target_stem
    output: processed_stem
    chain_ref: target_highpass_compression
  - kind: mix
    name: remix_target
    stem: processed_stem
    residual: residual
    output: final_audio
