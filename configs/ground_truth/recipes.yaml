        name: isolate_drums
        source: audio
        description: ${bindings.target_description}
        outputs:
          - drum_stem
          - residual
      - kind: send_return
        name: drum_parallel
        source: drum_stem
        output: processed_stem
        dry_level: 1.0
        send_level:
          sample: drums.parallel_compression.send_level
        return_level:
          sample: drums.parallel_compression.return_level
        chain_ref: parallel_compression_bus
      - kind: mix
        name: remix_drums
        stem: processed_stem
        residual: residual
        output: final_audio
  # Simple stem rebalance up.
  - id: light_drum_distortion
