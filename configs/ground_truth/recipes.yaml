    when:
      contains_any:
        path: metadata.analysis.genres
        values:
        - ambient
        - electronic
        - lounge
  graph:
  - kind: separate
    name: isolate_target
    source: audio
    description: ${bindings.target_description}
    outputs:
    - target_stem
    - residual
  - kind: send_return
    name: target_space
    source: target_stem
    output: processed_stem
    dry_level: 1.0
    send_level:
      sample: space.shared_send.send_level
    return_level:
      sample: space.shared_send.return_level
    chain_ref: band_limited_space_send_free
  - kind: mix
    name: remix_target
    stem: processed_stem
    residual: residual
    output: final_audio
- id: vocal_sibilance_cleanup
  description: Peak-cut based vocal de-essing fallback when sibilance is detected.
  tags:
  - cleanup
  - eq
  - eq_peak
  weight: 1.0
  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
  when:
    all:
    - eq:
        path: bindings.target_family
        value: vocals
    - contains_any:
        path: metadata.analysis.issues
        values:
        - sibilance
        - hiss
  graph:
  - kind: separate
    name: isolate_vocals
    source: audio
    description: ${bindings.target_description}
    outputs:
    - vocal_stem
    - residual
  - kind: chain
    prefix: vocal_cleanup
    order_profile: eq_cleanup
    source: vocal_stem
    output: processed_stem
    steps:
    - name: tame_sibilance
      operator: apply_peak_filter
      params:
        cutoff_frequency_hz:
          sample: cleanup.vocal_sibilance.cut_hz
        gain_db:
          sample: cleanup.vocal_sibilance.cut_db
        q:
          sample: cleanup.vocal_sibilance.q
  - kind: mix
    name: remix_vocals
    stem: processed_stem
    residual: residual
    output: final_audio
