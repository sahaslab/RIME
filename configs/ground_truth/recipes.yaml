# Recipes emit all plausible plans from intrinsic clip analysis.
# They do not depend on a user intent field.
#
# Common fields:
# - `bindings`: names derived from analysis metadata and reused in the graph
# - `when`: predicate gating recipe eligibility
# - `weight_rules`: optional prior shaping based on analysis
# - `graph`: declarative edit-graph template
# - `chain_ref`: include a reusable motif
recipes:
  # Generic send-return ambience for non-drum targets in genres where obvious
  # space is plausible.
  - id: target_space_send_synced
    description: Band-limited send-return ambience with tempo-synced delay.
    tags:
      - time_based
      - delay
      - synced_delay
      - reverb
      - send_return
    weight: 0.8
    bindings:
      target_candidate:
        each_from: metadata.analysis.target_candidates
      target_description:
        ref: bindings.target_candidate.stem
      target_family:
        ref: bindings.target_candidate.family
    when:
      all:
        - exists:
            path: bindings.target_description
        - neq:
            path: bindings.target_family
            value: drums
        - neq:
            path: bindings.target_family
            value: other
        - not:
            contains_any:
              path: metadata.analysis.genres
              values:
                - classical
                - folk
    weight_rules:
      - name: space_more_common_on_vocals
        action: multiply
        multiplier: 1.2
        when:
          eq:
            path: bindings.target_family
            value: vocals
      - name: space_more_common_in_pop_and_rock
        action: multiply
        multiplier: 1.1
        when:
          contains_any:
            path: metadata.analysis.genres
            values:
              - pop
              - rock
              - electronic
    graph:
      - kind: separate
        name: isolate_target
        source: audio
        description: ${bindings.target_description}
        outputs:
          - target_stem
          - residual
      - kind: send_return
        name: target_space
        source: target_stem
        output: processed_stem
        dry_level: 1.0
        send_level:
          sample: space.shared_send.send_level
        return_level:
          sample: space.shared_send.return_level
        chain_ref: band_limited_space_send_synced
      - kind: mix
        name: remix_target
        stem: processed_stem
        residual: residual
        output: final_audio
