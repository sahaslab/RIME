- id: restore_buried_target
  description: Restore a buried stem by undoing an intentional level drop.
  tags:
  - cleanup
  - level
  - gain
  weight: 0.85
  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
    correction_gain_db:
      sample: balance.target_gain.up_db
  when:
    all:
    - exists:
        path: bindings.target_description
    - neq:
        path: bindings.target_family
        value: other
  graph:
  - kind: separate
    name: isolate_target
    source: audio
    description: ${bindings.target_description}
    outputs:
    - target_stem
    - residual
  - kind: chain
    prefix: restore_target
    source: target_stem
    output: processed_stem
    steps:
    - name: gain_up
      operator: apply_gain
      params:
        gain_db:
          ref: bindings.correction_gain_db
  - kind: mix
    name: remix_target
    stem: processed_stem
    residual: residual
    output: final_audio
  poisons:
  - id: buried_target
    description: Reduce the target stem so the corrective task is to bring it back
      up.
    tags:
    - poison
    - level
    - gain
    issues:
    - buried_target
    graph:
    - kind: separate
      name: isolate_target
      source: audio
      description: ${bindings.target_description}
      outputs:
      - target_stem
      - residual
    - kind: chain
      prefix: bury_target
      source: target_stem
      output: processed_stem
      steps:
      - name: gain_down
        operator: apply_gain
        params:
          gain_db:
            scale:
              value:
                ref: bindings.correction_gain_db
              factor: -1.0
    - kind: mix
      name: remix_target
      stem: processed_stem
      residual: residual
      output: poisoned_audio
