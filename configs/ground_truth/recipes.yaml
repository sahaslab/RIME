    - neq:
        path: bindings.target_family
        value: other
    - not:
        contains_any:
          path: metadata.analysis.genres
          values:
          - classical
          - folk
  weight_rules:
  - name: free_delay_less_common_on_vocals
    action: multiply
    multiplier: 0.85
    when:
      eq:
        path: bindings.target_family
        value: vocals
  - name: free_delay_more_common_in_ambient_electronic
    action: multiply
