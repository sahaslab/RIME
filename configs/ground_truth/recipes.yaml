  - kind: mix
    name: remix_vocals
    stem: processed_stem
    residual: residual
    output: final_audio
- id: vocal_harmony_support
  description: Add a harmony stem, tuck it back, and band-limit it before remixing.
  tags:
  - pitch
  - harmony
  - send_return
  weight: 0.45
  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
  when:
    all:
    - eq:
        path: bindings.target_family
        value: vocals
    - not:
        contains_any:
          path: metadata.analysis.genres
          values:
          - classical
          - folk
  graph:
  - kind: separate
    name: isolate_vocals
    source: audio
    description: ${bindings.target_description}
    outputs:
    - vocal_stem
    - residual
  - kind: send_return
    name: harmony_bus
    order_profile: harmony_aux
    source: vocal_stem
    output: processed_stem
    dry_level: 1.0
    send_level: 1.0
    return_level: 1.0
    steps:
    - name: harmony
      operator: apply_harmony_effect
      params:
        semitones:
          coalesce:
          - ref: metadata.analysis.harmony_semitones
          - sample: vocals.harmony.intervals
    - name: tuck_harmony
      operator: apply_gain
      params:
        gain_db:
          sample: vocals.harmony.backoff_db
    - name: harmony_highpass
      operator: apply_highpass_filter
      params:
        cutoff_frequency_hz:
          sample: vocals.harmony.post_eq.highpass_hz
    - name: harmony_lowpass
      operator: apply_lowpass_filter
      params:
        cutoff_frequency_hz:
          sample: vocals.harmony.post_eq.lowpass_hz
  - kind: mix
    name: remix_vocals
    stem: processed_stem
    residual: residual
    output: final_audio
