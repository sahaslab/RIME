  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
  when:
    eq:
      path: bindings.target_family
      value: vocals
  graph:
  - kind: separate
    name: isolate_vocals
    source: audio
    description: ${bindings.target_description}
    outputs:
    - vocal_stem
    - residual
  - kind: chain
    prefix: vocal_control
    source: vocal_stem
