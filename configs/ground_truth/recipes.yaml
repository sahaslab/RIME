  # Mixture-level hum cleanup when hum is detected.
  - id: hum_cleanup
    description: Low-end cleanup for clips flagged with mains hum.
    tags:
      - cleanup
      - eq
      - eq_pass
    weight: 0.95
    when:
      contains_any:
        path: metadata.analysis.issues
        values:
          - hum
    graph:
      - kind: chain
        prefix: hum_cleanup
        order_profile: eq_cleanup
        source: audio
        output: final_audio
        steps:
          - name: highpass_hum
            operator: apply_highpass_filter
            params:
              cutoff_frequency_hz:
                sample: cleanup.hum.highpass_hz
