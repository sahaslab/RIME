- id: synthetic_hum_cleanup
  description: Remove synthetic mains hum from the full mix.
  tags:
  - cleanup
  - eq
  - eq_pass
  weight: 0.8
  bindings:
    hum_frequency_hz:
      values:
      - 50.0
      - 60.0
  graph:
  - kind: chain
    prefix: hum_cleanup
    order_profile: eq_cleanup
    source: audio
    output: final_audio
    steps:
    - name: highpass_hum
      operator: apply_highpass_filter
      params:
        cutoff_frequency_hz:
          ref: bindings.hum_frequency_hz
  poisons:
  - id: synthetic_mains_hum
    description: Add 50 or 60 cycle hum so the corrective task is a simple low-end
      cleanup.
    tags:
    - poison
    - noise
    - hum
    issues:
    - hum
    graph:
    - kind: chain
      prefix: add_hum
      source: audio
      output: poisoned_audio
      steps:
      - name: mains_hum
        operator: introduce_mains_hum
        params:
          fundamental_hz:
            ref: bindings.hum_frequency_hz
          level_db:
            sample: poison.noise.hum_level_db
          modulation_hz:
            sample: poison.noise.hum_modulation_hz
- id: synthetic_rumble_cleanup
  description: Remove synthetic low-frequency rumble from the full mix.
  tags:
  - cleanup
  - eq
  - eq_pass
  weight: 0.8
  graph:
  - kind: chain
    prefix: rumble_cleanup
    order_profile: eq_cleanup
    source: audio
    output: final_audio
    steps:
    - name: highpass_rumble
      operator: apply_highpass_filter
      params:
        cutoff_frequency_hz:
          sample: cleanup.rumble.highpass_hz
  poisons:
  - id: synthetic_low_frequency_rumble
    description: Add sub-bass rumble so the corrective task is a highpass cleanup.
    tags:
    - poison
    - noise
    - rumble
    issues:
    - rumble
    graph:
    - kind: chain
      prefix: add_rumble
      source: audio
      output: poisoned_audio
      steps:
      - name: low_frequency_rumble
        operator: introduce_low_frequency_rumble
        params:
          level_db:
            sample: poison.noise.rumble_level_db
          highpass_hz:
            sample: poison.noise.rumble_highpass_hz
          lowpass_hz:
            sample: poison.noise.rumble_lowpass_hz
          modulation_hz:
            sample: poison.noise.rumble_modulation_hz
