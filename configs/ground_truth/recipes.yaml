- id: target_highshelf_compression
  description: Shape and compress the target using the existing EQ-before-dynamics
    order.
  tags:
  - eq
  - dynamics
  - compression
  weight: 1.0
  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
  when:
    all:
    - exists:
        path: bindings.target_description
    - neq:
        path: bindings.target_family
        value: other
  graph:
  - kind: separate
    name: isolate_target
    source: audio
    description: ${bindings.target_description}
    outputs:
    - target_stem
    - residual
  - kind: chain
    prefix: target_highshelf_compression
    source: target_stem
    output: processed_stem
    chain_ref: target_highshelf_compression
  - kind: mix
    name: remix_target
    stem: processed_stem
    residual: residual
    output: final_audio
