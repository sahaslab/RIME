- id: target_compression_reverb_send
  description: Apply compression then reverb using send routing.
  tags:
  - compression
  - reverb
  - send_return
  - time_based
  weight: 1.0
  bindings:
    target_candidate:
      each_from: metadata.analysis.target_candidates
    target_description:
      ref: bindings.target_candidate.stem
    target_family:
      ref: bindings.target_candidate.family
  when:
    all:
    - exists:
        path: bindings.target_description
    - neq:
        path: bindings.target_family
        value: other
  graph:
  - kind: separate
    name: isolate_target
    source: audio
    description: ${bindings.target_description}
    outputs:
    - target_stem
    - residual
  - kind: chain
    prefix: prepare_target
    source: target_stem
    output: prepared_stem
    chain_ref: control_compression
  - kind: send_return
    prefix: target_compression_reverb_send
    source: prepared_stem
    output: processed_stem
    chain_ref: target_reverb_send
    name: target_compression_reverb_send
    dry_level: 1.0
    send_level:
      sample: space.shared_send.send_level
    return_level:
      sample: space.shared_send.return_level
  - kind: mix
    name: remix_target
    stem: processed_stem
    residual: residual
    output: final_audio
