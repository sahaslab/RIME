  # Family grouping controls which recipes and constraints can fire.
  target_families:
    vocals:
      - vocals
    drums:
      - drums
    bass:
      - bass
    guitar:
      - guitar
    # piano:
    #   - piano

  # Human-facing stem names used in prompts and plan output.
  target_stems:
    bass: bass
    drums: drums
    guitar: guitar
    other: other
    piano: piano
    vocals: vocals

  # Candidate ordering is purely heuristic and only affects output ordering.
  family_priority:
    vocals: 3.0
    drums: 2.0
    bass: 1.75
    guitar: 1.5
    piano: 1.25
    other: 1.0
