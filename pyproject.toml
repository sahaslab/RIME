[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RIME"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "python-dotenv==1.1.1"
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.2.0"
]

[tool.setuptools.packages.find]
include = ["project_name*"]

[tool.ruff]
line-length = 192
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade (PEP 585, etc.)
    "Q",    # flake8-quotes
    "I",    # import rules
    "TID"   # tidy imports (relative import warnings)
]
ignore = ["UP031"] # Percent-formatting OK

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = false

[tool.ruff.lint.pyupgrade]
# Enforce modern typing (per PEP 585)
keep-runtime-typing = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort.sections]
"data" = ["numpy", "scipy", "sklearn", "pandas", "torch", "torchvision", "torchaudio"]
"other" = ["tqdm", "typing"]


[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-between-types = 0
length-sort = true
section-order = ["future", "standard-library", "first-party", "data", "third-party", "local-folder", "other"]
no-lines-before = ["future", "standard-library", "first-party", "data", "third-party", "local-folder", "other"]
